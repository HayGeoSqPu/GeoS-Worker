name: Long Running PAGASA Cron

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch: # Enables manual execution from the GitHub Actions UI

jobs:
  run-heavy-task:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Explicitly set limit up to 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Uvicorn in Background & Trigger Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # 1. Start Uvicorn in the background using '&'
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          
          # 2. Poll until the server responds (up to 30s safety timeout)
          echo "Waiting for Uvicorn server to spin up..."
          timeout 30s bash -c 'until curl -s http://127.0.0.1:8000/api/v1/cron/activate?dry_run=true > /dev/null; do sleep 1; done'

          # 3. Trigger the full execution endpoint
          echo "Triggering POST /cron/activate..."
          curl -X POST "http://127.0.0.1:8000/api/v1/cron/activate?dry_run=false" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --fail