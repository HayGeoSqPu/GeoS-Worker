name: Long Running PAGASA Cron

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch: # Enables manual execution from the GitHub Actions UI

jobs:
  run-heavy-task:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Explicitly set limit up to 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Uvicorn in Background & Trigger Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # 1. Start Uvicorn in background and log output to uvicorn.log
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          UVICORN_PID=$!

          # 2. Poll root/docs to confirm Uvicorn is up (up to 30s)
          echo "Waiting for Uvicorn server to spin up..."
          READY=0
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/ > /dev/null || curl -s http://127.0.0.1:8000/docs > /dev/null; then
              READY=1
              echo "Uvicorn is ready!"
              break
            fi
            sleep 1
          done

          # 3. If Uvicorn failed to start, print logs and exit
          if [ $READY -eq 0 ]; then
            echo "❌ Uvicorn failed to start. Printing uvicorn.log:"
            cat uvicorn.log
            exit 1
          fi

          # 4. Trigger the actual cron endpoint
          echo "Triggering POST /cron/activate..."
          curl -X POST "http://127.0.0.1:8000/api/v1/cron/activate?dry_run=false" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --fail